[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [
    "data_임시",
    "seeds",
    "uploads",
    ".venv",
    "__pycache__"
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # Line too long (handled by ruff format)
    "F401",  # Unused imports in __init__.py or test mocks
    "F841"   # Unused local variables
]
