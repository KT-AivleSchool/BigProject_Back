name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
      - main2
      - develop
      - develop2
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 using SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GITHUB_TOKEN
          script: |
            set -e # 명령어 중 하나라도 실패하면 즉시 중단하고 실패 처리합니다.
            
            cd ~/BigProject_Back
            
            # 1. Fetch the exact triggered branch code (HTTPS 인증 방식으로 변경하여 권한 오류 방지)
            git remote set-url origin https://x-access-token:$GITHUB_TOKEN@github.com/${{ github.repository }}.git
            git fetch origin ${{ github.ref_name }}
            
            # 브랜치가 없으면 만들고, 있으면 해당 리모트 브랜치로 강제 초기화
            git checkout -B ${{ github.ref_name }} origin/${{ github.ref_name }}
            
            # 2. Add Swap Memory to prevent OOM (Out Of Memory) during docker build
            if [ ! -f /swapfile ]; then
              echo "Creating 2GB swap file to prevent OOM..."
              sudo fallocate -l 2G /swapfile
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
              echo "Swap file created successfully."
            else
              echo "Swap file already exists."
            fi
            
            # 3. Build and restart containers (runs detached)
            docker-compose up -d --build
            
            # 3. Clean up dangling images to save space
            docker image prune -f
