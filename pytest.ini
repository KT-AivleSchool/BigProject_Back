[pytest]
pythonpath = .
# test_*.py 이름이지만 실제로는 `python 파일.py`로 직접 실행하는 콘솔 스크립트.
# pytest가 수집하면 import 단계에서 graph.py의 ChatOpenAI 초기화가 돌아
# CI(OPENAI_API_KEY 미주입)에서 collection 에러가 난다 → 수집 제외.
#
# 🔴 2026-08-10 — 루트에 있던 test_*.py 5개를 `tests/` 로 옮겼다. **경로가 바뀌면
#    `--ignore` 는 조용히 아무것도 안 거른다**(없는 경로를 무시하는 건 에러가 아니다)
#    → 옛 경로를 그대로 두면 CI 에서 collection 에러로 되살아난다.
addopts = --ignore=tests/test_multi_docs_persona.py --ignore=tests/test_api_client.py
# 🔴 `dummy/` 는 옮겨둔 일회성 스크립트 보관함이다. 이름이 test_* 는 아니지만
#    수집 대상에서 아예 뺀다 — 안에 DB·LLM 을 실제로 부르는 것들이 있다.
norecursedirs = seeds seeds_excluded data_임시 uploads dummy
