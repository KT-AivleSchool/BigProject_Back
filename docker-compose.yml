services:
  db:
    container_name: omnisite-postgres-db
    build:
      context: .
      dockerfile: Dockerfile.db
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_omnisite_pass}
      POSTGRES_DB: omnisite
    volumes:
      - omnisite_postgres_data:/var/lib/postgresql/data
      - ./omnisite_seed.sql.gz:/docker-entrypoint-initdb.d/01_seed.sql.gz:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d omnisite"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: omnisite-redis-cache
    ports:
      - "127.0.0.1:6379:6379"
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-redis_omnisite_pass}
      - --maxmemory
      - 2gb
      - --maxmemory-policy
      - volatile-lru
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - omnisite_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  api:
    container_name: omnisite-fastapi
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres_omnisite_pass}@db:5432/omnisite
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_omnisite_pass}@redis:6379/0
    env_file:
      - path: .env
        required: false
    volumes:
      - ./datasets:/code/datasets
      - ./runs:/code/runs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  front:
    container_name: omnisite-nextjs-front
    build:
      context: ../BigProject_Front
      dockerfile: Dockerfile
      args:
        - OMNISITE_API_ORIGIN=http://api:8000
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - OMNISITE_API_ORIGIN=http://api:8000
    depends_on:
      - api
    restart: always

volumes:
  omnisite_postgres_data:
    driver: local
  omnisite_redis_data:
    driver: local
