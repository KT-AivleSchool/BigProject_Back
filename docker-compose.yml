version: '3.8'

services:
  db:
    container_name: omnisite-postgres-db
    build:
      context: .
      dockerfile: Dockerfile.db
    # 🔴 2026-08-07 침해. "5432:5432" 는 0.0.0.0 바인딩이라 인터넷 전체에 열린다.
    #    비밀번호가 postgres 라 봇이 무차별 대입으로 뚫고 DB 를 DROP 했다.
    #    로컬 루프백에만 붙인다 — 앞의 127.0.0.1 을 지우지 말 것.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      # 기본값을 두지 않는다. .env 에 없으면 기동이 실패해야 한다 —
      # 기본값이 있으면 빠뜨렸을 때 조용히 약한 암호로 뜬다(그래서 뚫렸다).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 설정할 것}
      POSTGRES_DB: omnisite
    volumes:
      - omnisite_postgres_data:/var/lib/postgresql/data
      # 빈 볼륨 최초 기동 시에만 자동 복원(경계 3종 제외, 스크립트로 별도 적재).
      # 이미 데이터 있는 볼륨엔 실행 안 됨 → 기존 데이터 안전.
      - ./omnisite_seed.sql.gz:/docker-entrypoint-initdb.d/01_seed.sql.gz:ro
    restart: always

  redis:
    image: redis:7-alpine
    container_name: omnisite-redis-cache
    # 🔴 위와 같은 이유. Redis 는 인증이 아예 없었다 —
    #    열린 6379 는 CONFIG SET dir 로 파일을 쓰는 공격에 그대로 노출된다.
    ports:
      - "127.0.0.1:6379:6379"
    # 캐시 영속화(#203 ①): AOF(유실 거의 0) + RDB(스냅샷 백업) + 볼륨(컨테이너 삭제에도 보존)
    #
    # 🔴 maxmemory 512mb → 2gb (PR #220 통합, 2026-08-10). 원본 데이터를 Redis 에
    #    바이트로 넣는 도구(`app/tools/seed_redis.py`)가 생겨서다 — 흡연 `data/` 하나가
    #    537MB(단일 최대 279MB)라 512mb 로는 못 들어간다.
    #    ⚠ 단일 값 상한은 maxmemory 와 **별개**다 — `proto-max-bulk-len` 512MB 다.
    #      512MB 넘는 파일 하나는 maxmemory 를 아무리 올려도 안 들어간다.
    #
    # 🔴 **volatile-lru 는 TTL 있는 키만 evict 한다.** 무TTL 키가 한도를 채우면 Redis 는
    #    걷어낼 것을 못 찾아 **모든 쓰기를 OOM 으로 거절**한다.
    #    ⚠ 여기 「무TTL 캐시(지오코딩 12분·지목 LLM)는 보존됨」이라고 적었던 건 **틀렸다**
    #      (2026-08-11 실측 정정). 그 둘은 Redis 가 아니라 **디스크 JSON**(`search_cache/`)이라
    #      Redis 와 아무 상관이 없다. 한도에 닿을 때 실제로 죽는 것은
    #      **로그인**(refresh 토큰 RTR · access 블랙리스트 · 잠금/레이트리밋 카운터)과
    #      **토론 SSE 중계**(pub/sub) · 업로드 색인이다.
    #      피해자를 틀리게 적으면 다음 사람이 엉뚱한 데를 본다.
    #    → 그래서 **여기 넣는 키는 전부 TTL 을 준다**:
    #      `seed_redis.py --ttl`(기본 24h) · `upload.py:_REDIS_TTL_SEC`(30일, 접근 시 갱신).
    #      maxmemory 를 올리는 건 시간을 버는 것이지 고치는 게 아니다.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD 를 .env 에 설정할 것}
      - --maxmemory
      - 2gb
      - --maxmemory-policy
      - volatile-lru
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - 3600 1 300 100 60 10000
    volumes:
      - omnisite_redis_data:/data
    restart: always

volumes:
  omnisite_postgres_data:
    driver: local
  omnisite_redis_data:
    driver: local
